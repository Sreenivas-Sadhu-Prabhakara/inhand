<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #171C21; }
  body { display: grid; place-items: center; }
  /* 12% safe padding -> mark fills the middle 76vmin */
  .mark { width: 76vmin; height: 76vmin; display: block; }
</style>
</head>
<body>
  <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
    <rect x="5"  y="8"  width="4.5" height="19" rx="1.4" fill="#8FA3B0"/>
    <rect x="11.5" y="12.5" width="4.5" height="14.5" rx="1.4" fill="#8FA3B0"/>
    <rect x="18" y="17" width="4.5" height="10" rx="1.4" fill="#8FA3B0"/>
    <rect x="24.5" y="20.5" width="4.5" height="6.5" rx="1.4" fill="#FF8A3D"/>
  </svg>
</body>
</html>
